<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CAPKA3D - Figura azul</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 1080px;
      height: 1080px;
      margin: 0;
      overflow: hidden;
      background: #eef1f4;
      font-family: Arial, Helvetica, sans-serif;
    }

    .canvas {
      position: relative;
      width: 1080px;
      height: 1080px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.92) 0%, rgba(238,241,244,.96) 46%, #ffffff 100%);
      color: #0d1b2a;
    }

    .topline {
      position: absolute;
      left: 72px;
      top: 72px;
      width: 936px;
      height: 3px;
      background: linear-gradient(90deg, #0d3e78 0 72%, #f05a18 72% 100%);
      opacity: .9;
    }

    .logo {
      position: absolute;
      left: 72px;
      top: 94px;
      width: 220px;
      height: auto;
      display: block;
    }

    .photo-wrap {
      position: absolute;
      left: 72px;
      top: 178px;
      width: 936px;
      height: 618px;
      overflow: hidden;
      border-radius: 8px;
      background: #dfe5eb;
      box-shadow: 0 24px 52px rgba(13, 62, 120, .16);
    }

    .photo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 45%;
      display: block;
      filter: saturate(1.05) contrast(1.04) brightness(1.02);
    }

    .photo-wrap::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,0) 42%, rgba(13,27,42,.10) 100%),
        linear-gradient(90deg, rgba(13,62,120,.10), rgba(13,62,120,0) 42%);
      pointer-events: none;
    }

    .content {
      position: absolute;
      left: 72px;
      right: 72px;
      top: 842px;
      display: grid;
      grid-template-columns: 1fr 286px;
      column-gap: 46px;
      align-items: end;
    }

    .eyebrow {
      margin: 0 0 16px;
      color: #f05a18;
      font-size: 25px;
      line-height: 1;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    h1 {
      margin: 0;
      max-width: 610px;
      color: #0d3e78;
      font-size: 63px;
      line-height: .98;
      font-weight: 900;
      letter-spacing: 0;
    }

    .subcopy {
      margin: 20px 0 0;
      max-width: 590px;
      color: #263849;
      font-size: 30px;
      line-height: 1.2;
      font-weight: 600;
      letter-spacing: 0;
    }

    .cta {
      justify-self: end;
      width: 286px;
      min-height: 112px;
      border-radius: 8px;
      background: #0d3e78;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 22px 24px;
      box-shadow: 0 18px 36px rgba(13, 62, 120, .22);
    }

    .cta span:first-child {
      color: #f8b082;
      font-size: 18px;
      line-height: 1;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0;
      margin-bottom: 8px;
    }

    .cta span:last-child {
      font-size: 27px;
      line-height: 1.08;
      font-weight: 800;
      letter-spacing: 0;
    }
  </style>
</head>
<body>
  <main class="canvas" aria-label="Pieza publicitaria CAPKA3D">
    <div class="topline"></div>
    <img class="logo" src="../logo-capka3d-horizontal.svg" alt="CAPKA3D">
    <section class="photo-wrap">
      <img src="../objetos/Fotos De Los Objetos Sin Editar/20210118_192711.jpg" alt="Figura impresa en 3D color azul">
    </section>
    <section class="content">
      <div>
        <p class="eyebrow">Impresión 3D personalizada</p>
        <h1>Figura impresa por encargo</h1>
        <p class="subcopy">A partir de tu archivo o enlace.</p>
      </div>
      <div class="cta">
        <span>Consultas</span>
        <span>Pedí tu presupuesto</span>
      </div>
    </section>
  </main>
</body>
</html>
